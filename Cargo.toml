[package]
name = "yomiage"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
dotenvy = "0.15.7"
serenity = "0.12.5"
songbird = { version = "0.6.0", features = ["builtin-queue"] }
tokio = { version = "1.53.1", features = ["fs", "macros", "rt-multi-thread", "signal"] }
reqwest = { version = "0.12.28", default-features = false, features = ["rustls-tls"] }
sha2 = "0.10.9"
# VOICEVOX returns WAV files. Songbird disables Symphonia codecs/formats by default.
symphonia = { version = "0.5.5", default-features = false, features = ["pcm", "wav"] }
